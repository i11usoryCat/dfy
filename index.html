<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大肥鱼">
<title>大肥鱼</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0f1417;color:#e8edee;font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
#top{padding:12px 16px;font-size:13px;color:#6f8288;border-bottom:1px solid #1b262b;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f1417;z-index:5;padding-top:calc(12px + env(safe-area-inset-top))}
#top b{color:#7fc9b9;font-weight:500}
#gear{font-size:18px;color:#5c7a80;padding:0 6px}
#log{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
.m{max-width:82%;padding:10px 14px;border-radius:14px;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.me{margin-left:auto;background:#1c3a36;color:#dff3ee;border-bottom-right-radius:4px}
.it{margin-right:auto;background:#161e22;color:#dfe7e9;border-bottom-left-radius:4px}
.sys{margin:0 auto 12px;font-size:12px;color:#5c6e74;text-align:center;max-width:88%;line-height:1.7}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1b262b;background:#0f1417}
#in{flex:1;background:#161e22;border:1px solid #243038;color:#e8edee;border-radius:12px;padding:11px 13px;font-size:16px;resize:none;max-height:120px;outline:none;font-family:inherit}
#in:focus{border-color:#3d6b63}
#go{width:56px;border:0;border-radius:12px;background:#2f6d63;color:#eafff8;font-size:15px}
#go:disabled{opacity:.35}
.dot::after{content:"...";opacity:.5}
#sheet{position:fixed;inset:0;background:#0f1417;z-index:20;display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px 20px;overflow-y:auto}
#sheet h2{font-size:17px;font-weight:500;margin:0 0 4px}
#sheet p{font-size:12px;color:#6f8288;margin:0 0 14px;line-height:1.7}
#sheet label{font-size:12px;color:#8fa3a8;display:block;margin:16px 0 6px}
#sheet input,#sheet textarea{width:100%;background:#161e22;border:1px solid #243038;color:#e8edee;border-radius:12px;padding:12px 13px;font-size:15px;outline:none;font-family:inherit}
#sheet textarea{min-height:120px;resize:vertical}
#sheet button{width:100%;border:0;border-radius:12px;background:#2f6d63;color:#eafff8;padding:13px;font-size:15px;margin-top:22px}
#sheet .ghost{background:#161e22;color:#9fb3b8;margin-top:10px}
</style></head><body>
<div id="top"><span>大肥鱼 · <b>直连</b></span><span id="gear">⚙</span></div>
<div id="log"></div>
<div id="bar"><textarea id="in" rows="1" placeholder="说点什么"></textarea><button id="go">发</button></div>
<div id="sheet">
  <h2>设置</h2>
  <p>只存在这台手机上，直接发往 api.deepseek.com，不经过任何服务器。</p>
  <label>API key</label>
  <input id="fkey" type="password" placeholder="sk-..." autocomplete="off">
  <label>关于我（可选）</label>
  <textarea id="fnote" placeholder="想让牠知道的，写在这儿。只存在本机。"></textarea>
  <button id="save">存下</button>
  <button id="exp" class="ghost">导出对话（.md）</button>
  <button id="close" class="ghost">关闭</button>
</div>
<script>
var BASE = "你是「大肥鱼」。\n\n对面的人做硬件、常年熬夜，说话直接，不喜欢被哄。\n\n短句。一句话能说完的，不说两句。\n先给结论，再给一句为什么。\n不接夸，不铺垫，不说「希望对你有帮助」。\n不知道就说不知道，不假装记得没见过的事。\n别替他做决定。\n\n现在多半是深夜。他不问，你就别催他睡。";
var $ = function (i) { return document.getElementById(i); };
var log = $("log"), inp = $("in"), go = $("go"), sheet = $("sheet");
var KEY = localStorage.getItem("dfy_key") || "";
var NOTE = localStorage.getItem("dfy_note") || "";
var hist = [];
try { hist = JSON.parse(localStorage.getItem("dfy_hist") || "[]"); } catch (e) { hist = []; }

function persona() { return NOTE.trim() ? BASE + "\n\n## 关于他\n\n" + NOTE.trim() : BASE; }

function add(cls, text) {
  var d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function save() { try { localStorage.setItem("dfy_hist", JSON.stringify(hist.slice(-60))); } catch (e) {} }

function paint() {
  log.innerHTML = "";
  if (!hist.length) {
    add("sys", "没有服务器，没有工具，没有别的会话的记忆。\n只连 api.deepseek.com。");
  }
  hist.forEach(function (m) { add(m.role === "user" ? "me" : "it", m.content); });
}
paint();

if (!KEY) { sheet.style.display = "flex"; }
$("gear").onclick = function () {
  $("fkey").value = KEY;
  $("fnote").value = NOTE;
  sheet.style.display = "flex";
};
$("close").onclick = function () { sheet.style.display = "none"; };
$("save").onclick = function () {
  KEY = $("fkey").value.trim();
  NOTE = $("fnote").value;
  localStorage.setItem("dfy_key", KEY);
  localStorage.setItem("dfy_note", NOTE);
  sheet.style.display = "none";
  if (KEY) inp.focus();
};
$("exp").onclick = function () {
  var out = "";
  hist.forEach(function (m) { out += (m.role === "user" ? "### 你" : "### 大肥鱼") + "\n\n" + m.content + "\n\n"; });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/markdown" }));
  a.download = "手机对话-" + new Date().toISOString().slice(0, 10) + ".md";
  a.click();
};

inp.addEventListener("input", function () { inp.style.height = "auto"; inp.style.height = inp.scrollHeight + "px"; });

async function send() {
  var text = inp.value.trim();
  if (!text || go.disabled) return;
  if (!KEY) { sheet.style.display = "flex"; return; }
  inp.value = ""; inp.style.height = "auto";
  add("me", text);
  hist.push({ role: "user", content: text }); save();
  go.disabled = true;
  var bubble = add("it dot", "");
  var acc = "";
  try {
    var r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + KEY },
      body: JSON.stringify({ model: "deepseek-chat", stream: true, temperature: 1.0,
        messages: [{ role: "system", content: persona() }].concat(hist.slice(-16)) })
    });
    if (!r.ok) {
      bubble.classList.remove("dot");
      bubble.textContent = "接口 " + r.status + "：" + (await r.text()).slice(0, 160);
      go.disabled = false; return;
    }
    var reader = r.body.getReader();
    var dec = new TextDecoder();
    var buf = "";
    for (;;) {
      var res = await reader.read();
      if (res.done) break;
      buf += dec.decode(res.value, { stream: true });
      var parts = buf.split("\n");
      buf = parts.pop() || "";
      for (var i = 0; i < parts.length; i++) {
        var line = parts[i].trim();
        if (line.indexOf("data:") !== 0) continue;
        var pl = line.slice(5).trim();
        if (pl === "[DONE]") { break; }
        try {
          var j = JSON.parse(pl);
          var d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (d) { acc += d; bubble.classList.remove("dot"); bubble.textContent = acc; log.scrollTop = log.scrollHeight; }
        } catch (e) {}
      }
    }
    bubble.classList.remove("dot");
    bubble.textContent = acc || "（没回上来）";
    if (acc) { hist.push({ role: "assistant", content: acc }); save(); }
  } catch (e) {
    bubble.classList.remove("dot");
    bubble.textContent = "断开了：" + e.message;
  }
  go.disabled = false;
}

go.onclick = send;
inp.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
}
</script></body></html>
